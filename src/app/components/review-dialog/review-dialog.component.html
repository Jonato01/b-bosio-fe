<h2 mat-dialog-title>
  <mat-icon>rate_review</mat-icon>
  Lascia una Recensione
</h2>

<p class="dialog-subtitle">{{ data.accommodationTitle }}</p>

<mat-dialog-content>
  <div class="rating-section">
    <label class="rating-label">Valutazione</label>
    <div class="stars-row">
      @for (star of stars; track star) {
        <button type="button" class="star-button"
                (click)="setRating(star)"
                (mouseenter)="setHoveredRating(star)"
                (mouseleave)="setHoveredRating(0)">
          <mat-icon class="star-icon" [class.filled]="isStarFilled(star - 1)">
            {{ isStarFilled(star - 1) ? 'star' : 'star_border' }}
          </mat-icon>
        </button>
      }
      <span class="rating-value">{{ rating() }}/5</span>
    </div>
    @if (rating() === 0) {
      <span class="rating-hint">Clicca su una stella per valutare</span>
    }
  </div>

  <form [formGroup]="form">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Commento</mat-label>
      <textarea matInput formControlName="comment" rows="4"
                placeholder="Scrivi la tua esperienza..."></textarea>
      <mat-icon matPrefix>notes</mat-icon>
    </mat-form-field>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="onCancel()" [disabled]="loading()">
    <mat-icon>close</mat-icon>
    Annulla
  </button>
  <button mat-raised-button color="primary" (click)="onSubmit()"
          [disabled]="rating() === 0 || loading()">
    @if (loading()) {
      <mat-spinner diameter="20"></mat-spinner>
    } @else {
      <ng-container>
        <mat-icon>send</mat-icon>
        Invia Recensione
      </ng-container>
    }
  </button>
</mat-dialog-actions>
