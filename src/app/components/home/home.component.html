<div class="home-container">
  <div class="hero-section">
    <div class="hero-content">
      <h1>B&Bosio</h1>
      <p class="subtitle">Sistema di prenotazione alloggi</p>

      @if (!authService.isAuthenticated()) {
        <div class="cta-buttons">
          <button mat-raised-button color="primary" routerLink="/register" class="cta-button">
            <mat-icon>person_add</mat-icon>
            Registrati
          </button>
          <button mat-flat-button routerLink="/login" class="cta-button">
            <mat-icon>login</mat-icon>
            Accedi
          </button>
        </div>
      } @else {
        <button mat-raised-button color="primary" (click)="navigateToBooking()" class="cta-button">
          <mat-icon>event_available</mat-icon>
          Prenota ora
        </button>
      }
    </div>
  </div>

  <footer class="home-footer">
    <p class="footer-text">Ti piace B&Bosio? Offrici un caffè!</p>
    <a href="https://www.paypal.com/donate/?business=renatogioana@icloud.com&amount=0.01&currency_code=EUR&item_name=Donazione+B%26Bosio"
       target="_blank" rel="noopener" class="donate-button">
      <mat-icon>favorite</mat-icon>
      Dona 0.01€
    </a>
  </footer>
</div>
